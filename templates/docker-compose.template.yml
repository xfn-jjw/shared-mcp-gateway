services:
  shared-mcp-gateway:
    # 直接使用当前项目 Dockerfile 构建镜像，便于保持代码与运行环境一致。
    build:
      context: .
      dockerfile: Dockerfile
    # 固定容器名，方便 docker ps / logs / exec 时快速定位。
    container_name: shared-mcp-gateway
    # 网关是基础设施型组件，建议默认随宿主机重启自动拉起。
    restart: unless-stopped
    ports:
      # 把容器内 8787 暴露到宿主机所有网卡，便于局域网通过 http://宿主机IP:8787 访问。
      # 如果只想本机访问，可改回 127.0.0.1:8787:8787。
      - "8787:8787"
    environment:
      # 根据你的下游 MCP 实际依赖补充环境变量。
      OBSIDIAN_VAULT_PATH: /workspace/openclaw-workspace
      PYTHONPATH: /workspace/mempalace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENSPACE_API_KEY: ${OPENSPACE_API_KEY:-}
      APIFOX_ACCESS_TOKEN: ${APIFOX_ACCESS_TOKEN:-}
      APIFOX_PROJECT_ID: ${APIFOX_PROJECT_ID:-}
      APIFOX_SITE_ID: ${APIFOX_SITE_ID:-}
      APIFOX_OAS: ${APIFOX_OAS:-}
      APIFOX_API_BASE_URL: ${APIFOX_API_BASE_URL:-}
      TAPD_ACCESS_TOKEN: ${TAPD_ACCESS_TOKEN:-}
      TAPD_API_USER: ${TAPD_API_USER:-}
      TAPD_API_PASSWORD: ${TAPD_API_PASSWORD:-}
      TAPD_API_BASE_URL: ${TAPD_API_BASE_URL:-https://api.tapd.cn}
      TAPD_BASE_URL: ${TAPD_BASE_URL:-https://www.tapd.cn}
      BOT_URL: ${BOT_URL:-}
      XXL_JOB_BASE_URL: ${XXL_JOB_BASE_URL:-}
      XXL_JOB_ADMIN_BASE_URL: ${XXL_JOB_ADMIN_BASE_URL:-}
      XXL_JOB_USERNAME: ${XXL_JOB_USERNAME:-}
      XXL_JOB_USER: ${XXL_JOB_USER:-}
      XXL_JOB_PASSWORD: ${XXL_JOB_PASSWORD:-}
      XXL_JOB_ENV_FILE: ${XXL_JOB_ENV_FILE:-/root/.xxl-job-mcp.env}
      # Chrome DevTools MCP 默认连接宿主机 remote-debugging Chrome。
      # Docker Desktop macOS 可用 host.docker.internal；Linux 可按需改成宿主网关地址。
      CHROME_DEVTOOLS_BROWSER_URL: ${CHROME_DEVTOOLS_BROWSER_URL:-http://host.docker.internal:9222}
      CHROME_DEVTOOLS_WS_ENDPOINT: ${CHROME_DEVTOOLS_WS_ENDPOINT:-}
      CHROME_DEVTOOLS_WS_HEADERS: ${CHROME_DEVTOOLS_WS_HEADERS:-}
      CHROME_DEVTOOLS_EXECUTABLE_PATH: ${CHROME_DEVTOOLS_EXECUTABLE_PATH:-}
      CHROME_DEVTOOLS_CHANNEL: ${CHROME_DEVTOOLS_CHANNEL:-}
      CHROME_DEVTOOLS_VIEWPORT: ${CHROME_DEVTOOLS_VIEWPORT:-}
      CHROME_DEVTOOLS_HEADLESS: ${CHROME_DEVTOOLS_HEADLESS:-false}
      CHROME_DEVTOOLS_ISOLATED: ${CHROME_DEVTOOLS_ISOLATED:-false}
      CHROME_DEVTOOLS_SLIM: ${CHROME_DEVTOOLS_SLIM:-false}
      CHROME_DEVTOOLS_MCP_EXTRA_ARGS: ${CHROME_DEVTOOLS_MCP_EXTRA_ARGS:-}
      # 1688 MCP 如需复用宿主机 OpenCLI Browser Bridge，可保留默认代理目标。
      OPENCLI_DAEMON_PORT: ${OPENCLI_DAEMON_PORT:-19825}
      OPENCLI_DAEMON_PROXY_TARGET: ${OPENCLI_DAEMON_PROXY_TARGET:-host.docker.internal:19825}
    volumes:
      # 下面这些路径请替换成你自己的绝对路径。
      # 原则：
      # - 大多数代码目录优先只读挂载，降低误改风险；
      # - 运行数据目录单独 rw 挂载，便于持久化。
      - /absolute/path/to/mcps:/workspace/mcps:ro
      - /absolute/path/to/mempalace:/workspace/mempalace:ro
      # OpenSpace 会在源码目录下写 logs / .openspace，因此建议 rw。
      - /absolute/path/to/OpenSpace:/workspace/OpenSpace:rw
      - /absolute/path/to/openclaw-workspace:/workspace/openclaw-workspace:rw
      - /absolute/path/to/mempalace-data:/root/.mempalace:rw
      # 1688 procurement assistant MCP 源码目录。
      - /absolute/path/to/1688mcp:/workspace/1688mcp:ro
      # 如需让 xxl-job-mcp 读取 env 文件，请先创建文件，再取消下一行注释。
      # - /absolute/path/to/.xxl-job-mcp.env:/root/.xxl-job-mcp.env:ro
    healthcheck:
      # 用 healthz 做容器探活，确保“端口可连”和“网关逻辑已起来”是同一件事。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

# 如果你后续要扩展：
# - 新增共享型 MCP，优先修改 registry.compose.toml，而不是直接堆 environment；
# - 新增宿主专属能力，优先记到 local_exceptions，并在文档里说明不进网关的原因。
