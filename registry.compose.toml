# Shared MCP Gateway 容器内运行默认示例。
# 说明：
# 1. 下面内容是案例配置，用于展示 Docker / Compose 场景下的推荐结构。
# 2. 落地到你的环境时，优先修改 volume 挂载和这里的容器内路径。
# 3. 更通用的复制模板请参考：templates/registry.compose.template.toml

[listen]
# 容器内通常监听 0.0.0.0，便于端口映射到宿主机。
host = "0.0.0.0"
port = 8787
path = "/mcp"

[gateway]
# 网关名称，会显示给客户端。
name = "shared-gateway"
# 聚合后工具名的命名空间分隔符。
namespace_separator = "."
# 当前示例以 Docker / Compose 场景为主。
description = "Shared MCP gateway for containerized deployment."

[[servers]]
# mempalace：容器内通过 PYTHONPATH 指向挂载目录。
# 注意：宿主机 ~/.mempalace/config.json 里常常写的是宿主机绝对路径，
# 例如 /Users/.../.mempalace/palace。该配置文件会被 volume 原样挂进容器，
# 若不覆盖，容器内会误读宿主机路径并报 "No palace found"。
key = "mempalace"
enabled = true
namespace = "mempalace"
language = "Python"
description = "共享记忆与知识图谱能力，用于写入/检索长期记忆、关系事实、语义搜索与时间线查询。"
command = "/usr/local/bin/python"
args = ["-m", "mempalace.mcp_server"]
env = { PYTHONPATH = "/workspace/mempalace", MEMPALACE_PALACE_PATH = "/root/.mempalace/palace" }

[[servers]]
# mysql-db：直接调用容器内挂载的 server.py。
key = "mysql-db"
enabled = true
namespace = "mysql_db"
language = "Python"
description = "MySQL 只读查询能力，用于查看表结构、索引、数据记录，以及执行安全的 SELECT / SHOW / EXPLAIN。"
command = "/usr/local/bin/python"
args = ["/workspace/mcps/mysql-connector/server.py"]

[[servers]]
# obsidian-kb：依赖外层 Compose 注入的 OBSIDIAN_VAULT_PATH 环境变量。
key = "obsidian-kb"
enabled = true
namespace = "obsidian_kb"
language = "Python"
description = "Obsidian 知识库读写能力，用于搜索、读取、更新笔记，以及查看反向链接。"
command = "/usr/local/bin/python"
args = ["/workspace/mcps/obsidian-kb-connector/server.py"]

[[servers]]
# tencent-cls：直接调用容器内挂载的 server.py。
key = "tencent-cls"
enabled = true
namespace = "tencent_cls"
language = "Python"
description = "腾讯云 CLS 日志检索能力，用于登录控制台并按 traceId 拉取完整日志，辅助排障。"
command = "/usr/local/bin/python"
args = ["/workspace/mcps/tencent-cls-connector/server.py"]

[[servers]]
# arthas：通过 profile 管理 Arthas HTTP IP/端口，观察目标 JVM 的类加载、方法触达、调用链和事务代理。
key = "arthas"
enabled = true
namespace = "arthas"
language = "Python"
description = "Arthas JVM 运行时诊断能力，用于确认线上代码版本、方法是否执行、调用链耗时、tt 现场和 Spring 事务代理是否生效。"
command = "/usr/local/bin/python"
args = ["/workspace/mcps/arthas-connector/server.py"]

[[servers]]
# openspace：容器内通过挂载源码 + python -m 方式运行。
# 为了适配 headless 容器，默认关闭 gui / web，仅保留 shell、mcp、system。
# 当前 compose 显式挂载 Codex skills 与本地 agent skills，逗号分隔后交给 OpenSpace 自动注册。
key = "openspace"
enabled = true
namespace = "openspace"
language = "Python"
description = "通用任务执行与技能编排能力，用于搜索技能、执行多步任务、演化并上传技能。"
command = "/usr/local/bin/python"
args = ["-m", "openspace.mcp_server"]
env = { PYTHONPATH = "/workspace/OpenSpace", OPENSPACE_HOST_SKILL_DIRS = "/workspace/codex-skills,/workspace/agent-skills", OPENSPACE_WORKSPACE = "/workspace/OpenSpace", OPENSPACE_BACKEND_SCOPE = "shell,mcp,system" }

[[servers]]
# apifox：通过 npm 包启动官方 MCP Server。
# 支持三种接入方式：
# 1) APIFOX_PROJECT_ID：读取 Apifox 项目（需要 APIFOX_ACCESS_TOKEN）
# 2) APIFOX_SITE_ID：读取 Apifox 文档站点（公开/共享文档场景）
# 3) APIFOX_OAS：直接读取 OpenAPI/Swagger 文件或 URL
# 可选 APIFOX_API_BASE_URL 用于私有化部署。
key = "apifox"
enabled = true
namespace = "apifox"
language = "Node.js"
description = "Apifox 项目 MCP 能力，用于读取接口定义、目录、文档与调试相关上下文。"
command = "/bin/bash"
args = ["-lc", "set -e; APIFOX_ARGS=''; if [ -n \"$APIFOX_PROJECT_ID\" ]; then if [ -z \"$APIFOX_ACCESS_TOKEN\" ]; then echo 'APIFOX_ACCESS_TOKEN is required when APIFOX_PROJECT_ID is set' >&2; exit 1; fi; APIFOX_ARGS=\"--project-id=$APIFOX_PROJECT_ID\"; elif [ -n \"$APIFOX_SITE_ID\" ]; then APIFOX_ARGS=\"--site-id=$APIFOX_SITE_ID\"; elif [ -n \"$APIFOX_OAS\" ]; then APIFOX_ARGS=\"--oas=$APIFOX_OAS\"; else echo 'One of APIFOX_PROJECT_ID / APIFOX_SITE_ID / APIFOX_OAS is required for apifox MCP' >&2; exit 1; fi; exec npx -y apifox-mcp-server@latest $APIFOX_ARGS ${APIFOX_API_BASE_URL:+--apifox-api-base-url=\"$APIFOX_API_BASE_URL\"}"]

[[servers]]
# tapd：通过官方 Python 包启动 TAPD MCP Server。
# 推荐配置 TAPD_ACCESS_TOKEN；也兼容 TAPD_API_USER + TAPD_API_PASSWORD。
# TAPD_API_BASE_URL / TAPD_BASE_URL 默认走 TAPD 公有云，可由 Compose 环境变量覆盖。
key = "tapd"
enabled = true
namespace = "tapd"
language = "Python"
description = "TAPD 研发协作管理能力，用于通过自然语言查询和管理需求、缺陷、任务、迭代等研发对象。"
command = "/bin/bash"
args = ["-lc", "set -e; if [ -z \"$TAPD_ACCESS_TOKEN\" ] && { [ -z \"$TAPD_API_USER\" ] || [ -z \"$TAPD_API_PASSWORD\" ]; }; then echo 'TAPD_ACCESS_TOKEN or TAPD_API_USER/TAPD_API_PASSWORD is required for tapd MCP' >&2; exit 1; fi; export TAPD_API_BASE_URL=\"${TAPD_API_BASE_URL:-https://api.tapd.cn}\" TAPD_BASE_URL=\"${TAPD_BASE_URL:-https://www.tapd.cn}\"; exec uvx mcp-server-tapd"]

[[servers]]
# xxl-job：通过 npm 包启动 XXL-JOB Admin MCP Server。
# 该 MCP 包含触发、启动、停止调度任务等有副作用工具，生产环境建议先接测试调度中心验证权限边界。
# 凭据可通过 Compose 环境变量注入，也可把 env 文件挂载到容器内 /root/.xxl-job-mcp.env。
key = "xxl-job"
enabled = true
namespace = "xxl_job"
language = "Node.js"
description = "XXL-JOB Admin 调度中心能力，用于登录校验、分页查询任务，以及按任务 ID 触发、启动、停止调度任务。"
command = "/bin/bash"
args = ["-lc", "set -e; for key in XXL_JOB_BASE_URL XXL_JOB_ADMIN_BASE_URL XXL_JOB_USERNAME XXL_JOB_USER XXL_JOB_PASSWORD; do if [ -z \"${!key}\" ]; then unset \"$key\"; fi; done; export XXL_JOB_ENV_FILE=\"${XXL_JOB_ENV_FILE:-/root/.xxl-job-mcp.env}\"; if [ ! -f \"$XXL_JOB_ENV_FILE\" ] && { [ -z \"${XXL_JOB_BASE_URL:-}${XXL_JOB_ADMIN_BASE_URL:-}\" ] || [ -z \"${XXL_JOB_USERNAME:-}${XXL_JOB_USER:-}\" ] || [ -z \"${XXL_JOB_PASSWORD:-}\" ]; }; then echo 'XXL_JOB_BASE_URL/XXL_JOB_USERNAME/XXL_JOB_PASSWORD or XXL_JOB_ENV_FILE is required for xxl_job MCP' >&2; exit 1; fi; exec npx -y xxl-job-mcp@1.2.0"]

[[servers]]
# 1688：本地采购助手 Chrome 插件 MCP，通过 OpenCLI Browser Bridge 与宿主机浏览器通信。
# 容器内启动脚本会把 127.0.0.1:19825 代理到宿主机 OpenCLI daemon，源码由 Compose 挂载到 /workspace/1688mcp。
key = "1688-procurement-assistant"
enabled = true
namespace = "1688"
language = "Node.js"
description = "1688采购助手插件 MCP 能力，用于检查插件状态、读写搜索历史、校验用户权限和打开批量询价弹窗。"
command = "/bin/bash"
args = ["/app/scripts/run_1688_mcp.sh"]

[[servers]]
# chrome-devtools：通过官方 npm 包启动 Chrome DevTools MCP。
# 容器中默认连接宿主机 remote-debugging Chrome；如需容器内 Chrome，可清空 CHROME_DEVTOOLS_BROWSER_URL 并配置 executable/headless。
key = "chrome-devtools"
enabled = true
namespace = "chrome_devtools"
language = "Node.js"
description = "Chrome DevTools 浏览器调试与自动化能力，用于页面导航、截图、控制台/网络分析与性能追踪。"
command = "/bin/bash"
args = ["/app/scripts/run_chrome_devtools_mcp.sh"]

[local_exceptions.shared_gateway]
# 当前由 shared-gateway 统一纳管的共享能力。
managed = ["mempalace", "mysql_db", "obsidian_kb", "tencent_cls", "arthas", "openspace", "apifox", "tapd", "xxl_job", "1688", "chrome_devtools"]
reason = "共享型 MCP 适合统一收口、统一日志与统一自检。"
